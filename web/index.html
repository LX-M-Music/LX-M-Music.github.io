<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LX-M Music 桌面版官网 - 免费开源的音乐播放器：扩展音源插件、五平台 Cookie 同步、歌曲换源、七档音质解锁">
  <meta name="keywords" content="LX-M, LX-M Music, lx-music, 洛雪音乐, 扩展音源, Cookie同步, 歌曲换源, 高音质">
  <meta name="theme-color" content="#0f172a">
  <title>LX-M Music - 扩展音源 · Cookie同步 · 高音质</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #e2e8f0;
    }

    /* 媒体背景层（由 Flutter 注册的 HtmlElementView 内部使用） */
    .lxm-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.1s ease;
      will-change: opacity;
    }

    .lxm-layer-active {
      opacity: 1;
    }

    .lxm-mask {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(7, 11, 20, 0.86) 0%, rgba(7, 11, 20, 0.58) 45%, rgba(7, 11, 20, 0.36) 100%),
        linear-gradient(to top, rgba(15, 23, 42, 1) 0%, rgba(15, 23, 42, 0) 24%),
        rgba(7, 11, 20, 0.26);
    }

    .lxm-mask-light {
      background:
        linear-gradient(to right, rgba(246, 248, 250, 0.92) 0%, rgba(246, 248, 250, 0.62) 45%, rgba(246, 248, 250, 0.4) 100%),
        linear-gradient(to top, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 24%),
        rgba(246, 248, 250, 0.32);
    }

    @media (prefers-reduced-motion: reduce) {
      .lxm-layer { transition: none; }
    }

    /* Flutter 加载前的骨架屏 */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(120% 90% at 80% 10%, rgba(74, 222, 128, 0.14) 0%, transparent 55%),
        linear-gradient(160deg, #0b1220 0%, #101a2b 55%, #0b1220 100%);
      color: #4ade80;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>
  <div id="splash">LX-M MUSIC</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
