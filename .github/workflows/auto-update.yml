name: Auto update mirrors & docs

# 每日自动刷新：镜像清单（聚合站爬取）+ 上游文档同步（README/FAQ/CHANGELOG）
# 有变更时自动提交并推送，推送会触发 Deploy to GitHub Pages 完成重新部署。

on:
  schedule:
    - cron: '20 21 * * *' # UTC 21:20 = 北京时间 5:20
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh mirror list
        run: node scripts/fetch-mirrors.mjs

      - name: Sync upstream docs
        run: node scripts/sync-app-docs.mjs

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore(auto): refresh mirror list & upstream docs"
            git push
          fi
